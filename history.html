<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat - TAMA Roblox</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <style>
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    .history-header h1 {
      font-family: 'Space Grotesk';
      font-size: 28px;
    }
    .filter-phone {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .filter-phone input {
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      color: var(--text);
      font-size: 12px;
      width: 180px;
    }
    body.light .filter-phone input {
      background: #fff;
      color: #24142f;
    }
    .filter-phone button {
      padding: 8px 16px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state h3 {
      font-family: 'Space Grotesk';
      font-size: 20px;
      color: var(--text);
    }
    .history-item .status-badge {
      font-size: 10px;
      padding: 4px 14px;
    }
    .history-item .price-text {
      font-weight: 800;
      font-size: 16px;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- LOADING -->
  <div id="loader">
    <div class="loader-box">
      <div class="loader-logo">TAMA</div>
      <div class="loader-sub">RIWAYAT</div>
      <div class="loader-bar"><span></span></div>
    </div>
  </div>

  <!-- HEADER -->
  <header>
    <div class="nav">
      <a href="index.html" class="brand">
        TAMA
        <small>RIWAYAT</small>
      </a>
      <nav class="nav-links">
        <a href="index.html">Beranda</a>
        <a href="index.html#layanan">Layanan</a>
        <a href="history.html" class="active">Riwayat</a>
      </nav>
      <a class="tiktok" href="https://www.tiktok.com/@tamastorebna" target="_blank" rel="noopener">
        <div class="tiktok-icon"></div>
        <span>tamastorebna <small>Follow</small></span>
      </a>
      <a href="admin.html" class="admin-icon" title="Admin Panel">🔐</a>
      <button class="theme-btn" id="themeBtn" aria-label="Ganti tema">
        <span>☼</span>
        <span>◐</span>
        <i class="theme-slider"></i>
      </button>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="history-header">
        <h1>📋 Riwayat Transaksi</h1>
        <div class="filter-phone">
          <input type="text" id="phoneFilter" placeholder="Cari nomor telepon..." />
          <button id="searchBtn">Cari</button>
          <button id="clearBtn" style="background:transparent;border:1px solid var(--line);color:var(--text);">Clear</button>
        </div>
      </div>

      <div id="historyList" class="history-list">
        <div class="empty-state">
          <h3>Belum ada transaksi</h3>
          <p style="color:var(--muted);font-size:12px;">Silakan order layanan terlebih dahulu.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <span>© 2026 TAMA Roblox Services</span>
      <span>Admin online 24 jam</span>
    </div>
  </footer>

  <script type="module">
    import { supabase } from './supabase.js';

    // ===== LOADING =====
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loader').classList.add('hide');
      }, 800);
    });

    // ===== THEME =====
    const themeBtn = document.getElementById('themeBtn');
    const saved = localStorage.getItem('tama-theme');
    if (saved === 'light') document.body.classList.add('light');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light');
      localStorage.setItem('tama-theme', document.body.classList.contains('light') ? 'light' : 'dark');
    });

    // ===== ELEMENTS =====
    const historyList = document.getElementById('historyList');
    const phoneFilter = document.getElementById('phoneFilter');
    const searchBtn = document.getElementById('searchBtn');
    const clearBtn = document.getElementById('clearBtn');

    let allOrders = [];

    // ===== FETCH HISTORY =====
    async function fetchHistory(phone = '') {
      let query = supabase
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false });

      if (phone.trim()) {
        query = query.ilike('phone', `%${phone.trim()}%`);
      }

      const { data, error } = await query;
      if (error) {
        console.error('Error fetching history:', error);
        return;
      }

      allOrders = data || [];
      renderHistory(allOrders);
    }

    // ===== RENDER =====
    function renderHistory(orders) {
      historyList.innerHTML = '';

      if (orders.length === 0) {
        historyList.innerHTML = `
          <div class="empty-state">
            <h3>${phoneFilter.value.trim() ? 'Tidak ditemukan' : 'Belum ada transaksi'}</h3>
            <p style="color:var(--muted);font-size:12px;">
              ${phoneFilter.value.trim() ? 'Coba dengan nomor lain.' : 'Silakan order layanan terlebih dahulu.'}
            </p>
          </div>
        `;
        return;
      }

      orders.forEach(order => {
        const date = new Date(order.created_at).toLocaleDateString('id-ID', {
          day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const statusClass = order.status === 'pending' ? 'status-pending' :
          order.status === 'approved' ? 'status-approved' : 'status-rejected';
        const statusLabel = order.status === 'pending' ? '⏳ Menunggu Verifikasi' :
          order.status === 'approved' ? '✅ Disetujui' : '❌ Ditolak';

        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `
          <div class="info">
            <div class="service-name">${order.service}</div>
            <div class="date">${date}</div>
            <div class="phone">📱 ${order.phone}</div>
          </div>
          <div style="text-align:right;">
            <div class="price-text">Rp ${new Intl.NumberFormat('id-ID').format(order.price)}</div>
            <span class="status-badge ${statusClass}">${statusLabel}</span>
          </div>
        `;
        historyList.appendChild(item);
      });
    }

    // ===== SEARCH =====
    searchBtn.addEventListener('click', () => {
      fetchHistory(phoneFilter.value);
    });
    phoneFilter.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') fetchHistory(phoneFilter.value);
    });
    clearBtn.addEventListener('click', () => {
      phoneFilter.value = '';
      fetchHistory('');
    });

    // ===== INIT =====
    fetchHistory('');

    console.log('📋 Riwayat transaksi siap!');
  </script>
</body>
</html>
